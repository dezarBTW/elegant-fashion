name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Audit production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      # Picomatch in ESLint's development-only dependency tree has no patched
      # release yet. Keep the finding visible without blocking production.
      - name: Report development dependency findings
        run: npm audit --package-lock-only --audit-level=high
        continue-on-error: true
